modules:
  confluence:contentAction:
    - key: task-bridge-content-action
      resource: main
      resolver:
        function: resolver
      render: native
      title: Task Bridge
  # 페이지 제목 아래에 연결 상태를 보여준다. 회의록을 읽는 사람은 더보기 메뉴를 열지 않는다.
  # 라벨은 페이지를 열 때마다 계산되므로 dynamicProperties 를 가볍게 유지한다
  confluence:contentBylineItem:
    - key: task-bridge-byline
      title: Task Bridge
      resource: byline
      resolver:
        function: resolver
      dynamicProperties:
        function: bylineProperties
      render: native
      viewportSize: small
  # 역방향. 사람이 없는 곳에서 도는 진입점이라 리졸버와 함수를 따로 둔다
  trigger:
    - key: issue-updated
      function: onIssueUpdated
      events:
        - avi:jira:updated:issue
  function:
    - key: resolver
      handler: index.handler
    - key: onIssueUpdated
      handler: reverse.onIssueUpdated
    - key: bylineProperties
      handler: byline.bylineProperties
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: byline
    path: src/frontend/byline.jsx
permissions:
  scopes:
    # 액션 아이템 조회와 상태 변경
    - read:task:confluence
    - write:task:confluence
    - read:page:confluence
    # 대상 프로젝트와 이슈 타입 조회, 이슈 생성
    - read:jira-work
    - write:jira-work
    # 태스크와 이슈 매핑 저장
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  # 정확히 하나가 required: true 여야 한다. Confluence 가 주 제품이고 Jira 는 연동 대상이라
  # Jira 를 optional 로 둔다. Jira 가 없는 사이트에도 설치되므로 화면이 그 상태를 다룬다
  compatibility:
    confluence:
      required: true
    jira:
      required: false
  id: ari:cloud:ecosystem::app/ca158947-1ec7-4cc1-aa54-fa5da6537739
