modules:
  confluence:contentAction:
    - key: task-bridge-content-action
      resource: main
      resolver:
        function: resolver
      render: native
      title: Task Bridge
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    # 액션 아이템 조회. 상태 변경 권한은 역방향을 만들 때 추가한다
    - read:task:confluence
    - read:page:confluence
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/ca158947-1ec7-4cc1-aa54-fa5da6537739
